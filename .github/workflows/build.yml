name: Build

# pushing a tag like v1.0 builds macOS and Windows and publishes a release;
# running it by hand from the Actions tab just builds, for testing
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest     # apple silicon
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # python rather than curl/unzip so it works the same on both runners
      - name: Download SADIE II HRIRs
        shell: python
        run: |
          import hashlib, io, urllib.request, zipfile
          url = "https://zenodo.org/records/12092466/files/D1_HRIR_SOFA.zip?download=1"
          data = urllib.request.urlopen(url).read()
          sofa = zipfile.ZipFile(io.BytesIO(data)).read("D1_HRIR_SOFA/D1_48K_24bit_256tap_FIR_SOFA.sofa")
          assert hashlib.sha256(sofa).hexdigest() == "9af7cb19531e52fb7ae8ec92621e6ab62b1d5fe584b3742be36699a0ddb0ccd4", "unexpected SOFA file"
          open("SADIEII_KU100.sofa", "wb").write(sofa)

      - name: Build
        run: pyinstaller --noconfirm ReMix.spec

      # the app is interactive, so just check it starts: imports, bundled data and the HRIRs all
      # load before it looks at the song path
      - name: Smoke test
        run: |
          set +e
          out=$(./dist/ReMix/ReMix does-not-exist.wav 2>&1)
          echo "$out"
          echo "$out" | grep -q "no such file"

      - name: Package
        run: |
          cp LICENSE NOTICE dist/ReMix/
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent ReMix ../ReMix-${{ matrix.name }}.zip
          else
            7z a -tzip ../ReMix-${{ matrix.name }}.zip ReMix > /dev/null
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ReMix-${{ matrix.name }}
          path: ReMix-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ReMix-*.zip --title "ReMix $GITHUB_REF_NAME" \
            --notes-file .github/release_notes.md
